# meltype-src を upstream main の HEAD に差し替えて、x86_64 と aarch64 でビルドする。
# 利用者が main を追ったときに通らなくなる変更を検出するだけで、lock は更新しない
name: upstream-main

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build .#fcitx5-meltype .#ibus-meltype --override-input meltype-src github:yksr-melt/Meltype --print-build-logs
